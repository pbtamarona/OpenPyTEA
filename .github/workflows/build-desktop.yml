name: Build desktop apps

# Builds the standalone OpenPyTEA desktop app for every platform on each
# release tag and publishes the installers to that tag's GitHub Release. A
# manual run (workflow_dispatch) updates a rolling "desktop-latest" pre-release.
# The app shares the library's version: a release tag (v3.2.2, or v3.2.2rc1
# for a pre-release) attaches the installers to that tag's release, the one
# that publishes to PyPI.
#
# The rolling tag is deliberately not named "latest" — Read the Docs
# reserves that name for its own default version, and a repo-level git tag
# called "latest" collides with it (RTD resolves its "latest" version by
# ref name and picks up the tag instead of the main branch tip).

on:
  push:
    # Branch builds of desktop-latest are paused so release builds don't
    # queue behind them; run the workflow by hand (Actions > Run workflow)
    # for one. To resume, restore:
    #   branches: [main]
    #   paths: [frontend/**, backend/**, src/**, scripts/**, docs/**, .github/workflows/build-desktop.yml]
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"]
  workflow_dispatch:

# Needed so the release job can create/update releases and move tags.
permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple Silicon)
            os: macos-14
            artifact: macos-arm64
            bundles: app,dmg
            rc_bundles: app,dmg
          - label: Windows (x64)
            os: windows-latest
            artifact: windows-x64
            bundles: nsis,msi
            rc_bundles: nsis

    # Linux (.deb/.AppImage) builds fine too — re-add an ubuntu leg plus the
    # apt step for webkit2gtk/appindicator when we want to ship it.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Tag is the single source of truth for release versions: v3.2.2
      # stamps 3.2.2 into tauri.conf.json (bundle names, app version) before
      # anything builds. Branch builds keep whatever version is checked in.
      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: python scripts/set_version.py "${GITHUB_REF_NAME#v}"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r backend/requirements.txt
          pip install pyinstaller

      # The smoke test launches the frozen binary and hits /api/health —
      # without it, a missing hidden import or data file only surfaces on a
      # user's machine (the Windows binary would otherwise never be run
      # anywhere before release).
      - name: Build backend sidecar (PyInstaller)
        run: python scripts/build_sidecar.py

      # The Sphinx docs ship inside the app (OpenPyTEA ▸ Documentation and
      # the (?) help links). Also regenerates the (?) help text from the
      # docs' reference tables.
      - name: Build bundled documentation
        run: |
          pip install -r docs/requirements.txt
          python scripts/build_docs.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Tauri app
        working-directory: frontend
        # The .msi only takes numeric pre-release versions, so rc tags build
        # just the .exe installer on Windows
        run: npm run tauri build -- --bundles ${{ (startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, 'rc') && matrix.rc_bundles) || matrix.bundles }}

      - name: Patch macOS bundle (custom UTI + re-sign + rebuild dmg)
        if: runner.os == 'macOS'
        run: python scripts/patch_macos_plist.py

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p dist-artifacts
          cd frontend/src-tauri/target/release/bundle
          find . -type f \
            \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' \
               -o -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' \) \
            -exec cp {} "$GITHUB_WORKSPACE/dist-artifacts/" \;
          ls -lh "$GITHUB_WORKSPACE/dist-artifacts/"

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: openpytea-${{ matrix.artifact }}
          path: dist-artifacts/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Determine release metadata
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "title=OpenPyTEA ${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            if [[ "${GITHUB_REF_NAME}" == *rc* ]]; then
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
            else
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "tag=desktop-latest" >> "$GITHUB_OUTPUT"
            echo "title=OpenPyTEA (latest build)" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Remove previous rolling release
        if: steps.meta.outputs.tag == 'desktop-latest'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release delete desktop-latest --yes --cleanup-tag || true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${{ steps.meta.outputs.tag }}"
          # A library release usually exists already (created on GitHub,
          # which publishes to PyPI): add the installers to it
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" artifacts/* --clobber
            exit 0
          fi
          notes="Automated build from commit ${GITHUB_SHA:0:7}."
          flags=()
          if [[ "${{ steps.meta.outputs.prerelease }}" == "true" ]]; then
            flags+=(--prerelease)
          fi
          if [[ "$tag" == desktop-latest ]]; then
            notes="$notes  Rolling pre-release — updated by manual builds of main."
          else
            # Tag pushed before its release: leave a draft, so publishing it
            # yourself still triggers the PyPI upload (a release made by this
            # workflow's token would not)
            flags+=(--draft)
          fi
          gh release create "$tag" artifacts/* \
            --target "${GITHUB_SHA}" \
            --title "${{ steps.meta.outputs.title }}" \
            --notes "$notes" \
            "${flags[@]}"
